spring.flyway.locations=classpath:db/migration,classpath:db/local
# IntelliJ 的 local 啟動可讀取未納管的 .env；正式環境仍由 Secret／環境變數注入。
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/main?serverTimezone=Asia/Taipei&characterEncoding=utf-8}
# 本機也不得在版本庫保存資料庫或登入密碼；啟動前由環境變數或未納管的 .env 提供。
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
pos.security.enabled=${POS_SECURITY_ENABLED:true}
pos.security.require-https=${POS_SECURITY_REQUIRE_HTTPS:false}
pos.security.maker-username=${POS_MAKER_USERNAME:}
pos.security.maker-password=${POS_MAKER_PASSWORD:}
pos.security.reviewer-username=${POS_REVIEWER_USERNAME:}
pos.security.reviewer-password=${POS_REVIEWER_PASSWORD:}
pos.security.user-username=${POS_USER_USERNAME:}
pos.security.user-password=${POS_USER_PASSWORD:}
# 本機既有帳號由 user_account 管理；只有明確提供成對環境變數時才補建 Admin，
# 避免弱密碼預設值讓安全檢核中止整個應用程式，也避免將開發密碼寫入版本庫。
pos.security.admin-username=${POS_ADMIN_USERNAME:}
pos.security.admin-password=${POS_ADMIN_PASSWORD:}
